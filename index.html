<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARISE 39081 | Ams Robotics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="main.css">
    <!-- Thư viện Three.js và OrbitControls điều khiển kéo xoay -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="nav-left">
            <img src="logo-arise-round.png" alt="ARISE Logo" class="logo-img" onerror="this.style.display='none'">
            <div class="nav-brand">
                <span class="brand-title">ARISE / 39081</span><br>
                <span class="brand-subtitle">FTC TEAM • HANOI, VIETNAM</span>
            </div>
        </div>
        <div class="nav-right">
            <a href="#">STORY</a>
            <a href="#">ROBOTS</a>
            <a href="#">GALLERY</a>
            <a href="#">UPDATES</a>
            <a href="#">CONTACT</a>
        </div>
    </nav>

    <!-- HERO SECTION -->
    <main class="hero-section">
        <div class="text-content">
            <h1 class="main-title">
                AMS <br>
                ROBOTICS
            </h1>
            <p class="description">Ams Robotics Innovation And Science Engineering</p>
        </div>

        <!-- KHUNG CHỨA 3D ROBOT -->
        <div class="robot-3d-wrapper">
            <div id="robot-canvas-container"></div>
            <div class="drag-hint">DRAG THE ROBOT • SCROLL</div>
        </div>
    </main>

    <!-- SCRIPT TẠO ROBOT 3D WIREFRAME -->
    <script>
        const container = document.getElementById('robot-canvas-container');
        const width = container.clientWidth;
        const height = container.clientHeight;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
        camera.position.set(20, 14, 25);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enableZoom = true;

        const robotGroup = new THREE.Group();
        scene.add(robotGroup);

        // Chất liệu khung lưới và điểm hạt phát sáng
        const lineMaterial = new THREE.LineBasicMaterial({ color: 0x8da4ff, transparent: true, opacity: 0.65 });
        const pointMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.15, transparent: true, opacity: 0.8 });

        function addWireframePart(geometry, x = 0, y = 0, z = 0, rotX = 0, rotZ = 0) {
            const wireframe = new THREE.WireframeGeometry(geometry);
            const line = new THREE.LineSegments(wireframe, lineMaterial);
            const points = new THREE.Points(geometry, pointMaterial);
            
            const part = new THREE.Group();
            part.add(line);
            part.add(points);
            
            part.position.set(x, y, z);
            part.rotation.x = rotX;
            part.rotation.z = rotZ;
            robotGroup.add(part);
        }

        // 1. Khung gầm chính (Chassis)
        addWireframePart(new THREE.BoxGeometry(14, 1.5, 12), 0, 0, 0);

        // 2. Tháp nâng trung tâm (Lift Tower) - ĐÃ SỬA LỖI TẠI ĐÂY
        addWireframePart(new THREE.BoxGeometry(8, 9, 8), 0, 5, 0); 
        addWireframePart(new THREE.CylinderGeometry(2.5, 2.5, 6, 16), 0, 11, 0);

        // 3. 4 Bánh xe Mecanum
        const wheelGeo = new THREE.CylinderGeometry(2.2, 2.2, 1.8, 16);
        addWireframePart(wheelGeo, -7.5, -0.2, 4.5, 0, Math.PI / 2);
        addWireframePart(wheelGeo, 7.5, -0.2, 4.5, 0, Math.PI / 2);
        addWireframePart(wheelGeo, -7.5, -0.2, -4.5, 0, Math.PI / 2);
        addWireframePart(wheelGeo, 7.5, -0.2, -4.5, 0, Math.PI / 2);

        // 4. Tay gắp phía trước (Intake)
        addWireframePart(new THREE.BoxGeometry(6, 2, 4), 0, 1.5, 7.5);

        // Lưới sàn (Grid floor)
        const gridHelper = new THREE.GridHelper(30, 20, 0x5a189a, 0x1e1e38);
        gridHelper.position.y = -2.5;
        scene.add(gridHelper);

        // Vòng lặp render
        function animate() {
            requestAnimationFrame(animate);
            robotGroup.rotation.y += 0.002; // Tự động xoay nhẹ khi không chạm chuột
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Tự động căn chỉnh khi đổi kích thước màn hình
        window.addEventListener('resize', () => {
            const newWidth = container.clientWidth;
            const newHeight = container.clientHeight;
            camera.aspect = newWidth / newHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(newWidth, newHeight);
        });
    </script>
</body>
</html>
