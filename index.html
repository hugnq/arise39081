<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARISE 39081 | Ams Robotics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="main.css">
    <!-- Thư viện Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="nav-left">
            <img src="logo-arise-round.png" alt="ARISE Logo" class="logo-img" onerror="this.style.display='none'">
            <div class="nav-brand">
                <span class="brand-title">ARISE / 39081</span><br>
                <span class="brand-subtitle">FTC TEAM • HANOI, VIETNAM</span>
            </div>
        </div>
        <div class="nav-right">
            <a href="#">STORY</a>
            <a href="#">ROBOTS</a>
            <a href="#">GALLERY</a>
            <a href="#">UPDATES</a>
            <a href="#">CONTACT</a>
        </div>
    </nav>

    <!-- HERO SECTION -->
    <main class="hero-section">
        <div class="text-content">
            <h1 class="main-title">
                AMS <br>
                ROBO<span class="special-t">t</span>ICS
            </h1>
            <p class="description">Ams Robotics Innovation And Science Engineering</p>
        </div>

        <!-- KHUNG CHỨA 3D LÕI CÔNG NGHỆ -->
        <div class="robot-3d-wrapper">
            <div id="robot-canvas-container"></div>
            <div class="drag-hint">DRAG TO EXPLORE</div>
        </div>
    </main>

    <!-- SCRIPT TẠO LÕI NĂNG LƯỢNG (SCIENCE CORE) -->
    <script>
        const container = document.getElementById('robot-canvas-container');
        const width = container.clientWidth;
        const height = container.clientHeight;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
        camera.position.set(0, 0, 30); // Đặt camera nhìn thẳng vào khối

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enableZoom = true;

        const coreGroup = new THREE.Group();
        scene.add(coreGroup);

        // Tạo hình khối đa diện (Icosahedron - Biểu tượng của sự sáng tạo khoa học)
        // Số 2 ở cuối là độ chi tiết (chia nhỏ các mặt)
        const geometry = new THREE.IcosahedronGeometry(9, 2);

        // 1. Lớp lưới màu xanh tím
        const wireframeMaterial = new THREE.LineBasicMaterial({ color: 0x8da4ff, transparent: true, opacity: 0.35 });
        const wireframe = new THREE.LineSegments(new THREE.WireframeGeometry(geometry), wireframeMaterial);
        coreGroup.add(wireframe);

        // 2. Lớp hạt sáng (Các điểm giao nhau)
        const pointsMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.15, transparent: true, opacity: 0.9 });
        const points = new THREE.Points(geometry, pointsMaterial);
        coreGroup.add(points);

        // Vòng lặp chuyển động
        function animate() {
            requestAnimationFrame(animate);
            // Cho khối tự động xoay lơ lửng đa chiều
            coreGroup.rotation.y += 0.002;
            coreGroup.rotation.x += 0.001; 
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Tự động căn chỉnh khi đổi kích thước màn hình
        window.addEventListener('resize', () => {
            const newWidth = container.clientWidth;
            const newHeight = container.clientHeight;
            camera.aspect = newWidth / newHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(newWidth, newHeight);
        });
    </script>
</body>
</html>
